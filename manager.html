<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex Pocket · 连接手机</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:#182334;font:16px/1.65 system-ui,-apple-system,sans-serif}main{max-width:920px;margin:52px auto;padding:0 24px}.brand{padding-left:50px;min-height:40px;display:flex;align-items:center;background:url('/assets/logo.png') no-repeat left center / 38px;font-size:14px;letter-spacing:2px;color:#718096}h1{font-size:36px;margin:10px 0}p{color:#718096}.card{background:white;border:1px solid #e5eaf2;border-radius:20px;padding:28px;margin:24px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px}img{width:100%;max-width:340px;border-radius:16px}.tag{display:inline-block;padding:4px 12px;background:#edf4ff;border-radius:99px;margin:4px}button{background:#147aff;border:0;color:white;padding:13px 20px;border-radius:12px;font:inherit;cursor:pointer}button.secondary{background:#edf4ff;color:#315f9b}textarea{width:100%;height:92px;border:1px solid #dce3ee;border-radius:10px;padding:12px;resize:vertical}#error{color:#a33c30}#pending{background:#edf4ff}small{color:#718096}@media(max-width:620px){.grid{grid-template-columns:1fr}main{margin-top:24px}h1{font-size:28px}}
</style><main><div class="brand">CODEX POCKET</div><h1>把电脑上的工作带到手机</h1><p>用安卓 App 扫码配对，随后在这里确认连接。</p><div id="error" role="alert"></div><div class="card"><b id="name">正在读取电脑状态…</b><div id="status"></div></div><div class="card" id="pending" hidden><b id="pendingName"></b><p id="fingerprint"></p><button id="approve">允许这台手机连接</button> <button id="decline" class="secondary">拒绝</button></div><div class="card grid"><div><img id="qr" alt="手机配对二维码"><small id="expires"></small></div><div><h2>连接你的安卓手机</h2><ol><li>安装 Codex Pocket APK。</li><li>打开 App，点击“扫码连接”。</li><li>扫描左侧二维码，再在电脑上允许连接。</li></ol><p>也可以将下面的配对内容粘贴到 App。</p><textarea id="link" readonly aria-label="配对内容"></textarea><button id="copy" class="secondary">复制配对内容</button></div></div><div class="card"><b>管理设备</b><p>重新生成配对码会撤销之前的手机，并使旧配对信息失效。</p><button id="reset" class="secondary">撤销手机并生成新配对码</button></div><small>电脑需要保持开机、联网，且桌面 Codex 正在运行。配对信息包含连接密钥，请只交给你自己的手机。</small></main>
<script>
const token=location.hash.slice(1)||sessionStorage.getItem('pocket-manager');if(token)sessionStorage.setItem('pocket-manager',token);history.replaceState(null,'',location.pathname);let pending;
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'无法读取电脑状态，请使用完整管理链接');return j}
function fail(e){document.querySelector('#error').textContent=e.message}
async function status(){try{const s=await api('/api/status');document.querySelector('#error').textContent=s.error||'';document.querySelector('#name').textContent=s.name;document.querySelector('#status').replaceChildren(...[['Codex',s.desktopReady],['中继',s.relayOnline],['手机',s.mobileOnline]].map(([n,v])=>{const el=document.createElement('span');el.className='tag';el.textContent=n+' · '+(v?'已连接':'未连接');return el}));pending=s.pairRequest;document.querySelector('#pending').hidden=!pending;if(pending){document.querySelector('#pendingName').textContent=pending.name+' 请求连接';document.querySelector('#fingerprint').textContent='设备标识：'+pending.fingerprint}}catch(e){fail(e)}}
async function pairing(){const p=await api('/api/pairing');document.querySelector('#qr').src=p.qr;document.querySelector('#link').value=p.link;document.querySelector('#expires').textContent=p.expiresAt>Date.now()?'二维码有效期至 '+new Date(p.expiresAt).toLocaleTimeString():'二维码已过期。已配对手机可直接使用；新手机需要重新生成配对码。'}
for(const [id,accept]of[['approve',true],['decline',false]])document.querySelector('#'+id).onclick=async()=>{try{await api('/api/decision',{fingerprint:pending.fingerprint,accept});await status()}catch(e){fail(e)}};
document.querySelector('#reset').onclick=async()=>{if(!confirm('撤销已连接手机，并生成新配对码？'))return;try{await api('/api/reset',{});await pairing();await status()}catch(e){fail(e)}};
document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(document.querySelector('#link').value);document.querySelector('#copy').textContent='已复制'}catch(e){fail(e)}};
pairing().catch(fail);status();setInterval(status,2500);
</script></html>

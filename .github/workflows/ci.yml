name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
  windows-state-directory:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Windows state directory startup
        shell: powershell
        env:
          POCKET_REQUIRE_ADMIN_OWNER_FIXTURE: "1"
        run: .\test\windows\state-directory.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test test/connector-entry.test.mjs
